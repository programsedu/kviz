<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kviz arena</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#3b1a78;--bg2:#24104d;--card:#fff;--ink:#1d1630;--muted:#6b6385;--line:#e4e0ee;
--c0:#e21b3c;--c1:#1368ce;--c2:#d89e00;--c3:#26890c;--c4:#864cbf;--c5:#0a8f8f;--ok:#26890c;--bad:#e21b3c;--accent:#ffb400}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));color:#fff;min-height:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100vh}
.btn{border:0;border-radius:10px;padding:.65em 1.1em;font-weight:700;background:#fff;color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .05s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:#2a1700}
.btn.green{background:var(--ok);color:#fff}
.btn.dark{background:#2b2240;color:#fff}
.btn.ghost{background:transparent;color:inherit;box-shadow:none;border:2px dashed currentColor;opacity:.8}
.btn.small{padding:.4em .7em;font-size:.88em}
.btn.big{font-size:1.25em;padding:.8em 1.4em}
.btn.danger{background:#fff;color:var(--bad)}
.wrap{max-width:1100px;margin:0 auto;padding:20px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px}
.logo{font-weight:900;font-size:1.6em;letter-spacing:.5px;display:flex;align-items:center;gap:.3em}
.logo small{font-weight:600;font-size:.5em;opacity:.8}
.spacer{flex:1}
select.lang{border-radius:8px;border:0;padding:.4em;font-weight:600}
.hero{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 26px}
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:16px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.qcard h3{margin:0 0 4px;font-size:1.15em;word-break:break-word}
.qcard .meta{color:var(--muted);font-size:.9em;margin-bottom:10px}
.qcard .icons{font-size:1.1em;margin-bottom:12px;letter-spacing:2px}
.qcard .row{display:flex;gap:6px;flex-wrap:wrap}
.qcard .row .btn{box-shadow:none;border:1px solid var(--line);background:#f6f4fb}
.qcard .row .btn.primary{background:var(--accent);border-color:transparent}
.qcard .row .btn.green{background:var(--ok);border-color:transparent;color:#fff}
.note{opacity:.8;font-size:.92em}
h2.sec{margin:8px 0 14px}
/* toast & modal */
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:.7em 1.2em;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99;max-width:90vw;text-align:center}
#toast.show{opacity:.95}
.modal-bg{position:fixed;inset:0;background:rgba(10,5,25,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:#fff;color:var(--ink);border-radius:16px;padding:20px;width:min(620px,100%);max-height:90vh;overflow:auto}
.modal h3{margin-top:0}
.typepick{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.typepick button{border:2px solid var(--line);background:#faf9fd;border-radius:12px;padding:12px;text-align:left;color:var(--ink)}
.typepick button:hover{border-color:var(--bg)}
.typepick b{display:block;margin:4px 0 2px}
.typepick span.d{font-size:.82em;color:var(--muted)}
.typepick .ic{font-size:1.6em}
label.chkrow{display:flex;gap:10px;align-items:center;margin:10px 0}
label.chkrow input{width:20px;height:20px}
/* editor */
.ed{display:grid;grid-template-columns:280px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
.ed-top{grid-column:1/3;display:flex;gap:10px;align-items:center;padding:10px 16px;background:rgba(0,0,0,.25);flex-wrap:wrap}
.ed-top input.title{flex:1;min-width:180px;border:0;border-radius:8px;padding:.55em .8em;font-weight:700;font-size:1.05em}
.ed-list{background:rgba(0,0,0,.15);padding:12px;overflow:auto;max-height:calc(100vh - 60px)}
.ed-item{background:rgba(255,255,255,.1);border:2px solid transparent;border-radius:10px;padding:8px 10px;margin-bottom:8px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.ed-item.sel{background:#fff;color:var(--ink);border-color:var(--accent)}
.ed-item .n{font-weight:800;min-width:1.6em}
.ed-item .tx{flex:1;font-size:.92em;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.ed-item .warn{color:var(--accent)}
.ed-item.sel .warn{color:#c47a00}
.ed-main{padding:18px;overflow:auto;max-height:calc(100vh - 60px)}
.ed-main .card{max-width:900px;margin:0 auto}
.field{margin-bottom:14px}
.field>label,.flabel{display:block;font-weight:700;font-size:.9em;margin-bottom:5px;color:var(--muted)}
.field input[type=text],.field input[type=number],.field textarea,.field select,.inp{width:100%;border:2px solid var(--line);border-radius:9px;padding:.55em .7em;color:var(--ink);background:#fff}
.field textarea.qtext{font-size:1.25em;font-weight:600;text-align:center;min-height:80px;resize:vertical}
.frow{display:flex;gap:12px;flex-wrap:wrap}
.frow>.field{flex:1;min-width:120px}
.problem{background:#fff4d6;color:#7a4b00;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-weight:600;font-size:.92em}
.imgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.imgbox img{max-height:160px;max-width:280px;border-radius:8px;border:1px solid var(--line)}
.ans-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.ans-ed{display:flex;align-items:center;gap:8px;border-radius:10px;padding:8px;color:#fff}
.ans-ed input{flex:1;border:0;border-radius:7px;padding:.55em;min-width:0}
.ans-ed .chk{width:36px;height:36px;border-radius:50%;border:3px solid #fff;background:transparent;color:transparent;font-weight:900;flex:none}
.ans-ed .chk.on{background:var(--ok);color:#fff}
.ans-ed .x,.listrow .x{background:transparent;border:0;color:inherit;font-size:1.4em;line-height:1;padding:0 4px;flex:none}
.shape{font-size:1.3em;width:1.4em;text-align:center;flex:none}
.c0{background:var(--c0)}.c1{background:var(--c1)}.c2{background:var(--c2)}.c3{background:var(--c3)}.c4{background:var(--c4)}.c5{background:var(--c5)}
.listrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.listrow .num{font-weight:800;width:1.6em;text-align:right;color:var(--muted)}
.listrow input{flex:1}
.tfpick{display:flex;gap:12px}
.tfpick button{flex:1;border:4px solid transparent;border-radius:12px;padding:18px;color:#fff;font-weight:800;font-size:1.2em;opacity:.55}
.tfpick button.on{opacity:1;border-color:#111}
.hint{font-size:.85em;color:var(--muted);margin:4px 0 10px}
.pinedit{position:relative;display:inline-block;max-width:100%;cursor:crosshair;user-select:none}
.pinedit img{display:block;max-width:100%;max-height:420px;border-radius:8px}
.pinzone{position:absolute;aspect-ratio:1;border-radius:50%;border:4px dashed #26890c;background:rgba(255,255,255,.18);box-shadow:0 0 0 2px #fff;transform:translate(-50%,-50%);pointer-events:none}
.qactions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:6px}
.qactions .btn{box-shadow:none;border:1px solid var(--line);background:#f6f4fb}
@media (max-width:760px){.ed{grid-template-columns:1fr}.ed-top{grid-column:1}.ed-list{max-height:none;display:flex;overflow-x:auto;gap:8px}.ed-item{min-width:170px;margin:0}.ed-main{max-height:none}.ans-grid{grid-template-columns:1fr}}
/* host */
.host{min-height:100vh;display:flex;flex-direction:column}
.hbar{display:flex;align-items:center;gap:10px;padding:10px 18px;background:rgba(0,0,0,.25);font-weight:700}
.lobby-top{display:flex;justify-content:center;gap:28px;align-items:center;flex-wrap:wrap;padding:24px}
.joininfo{background:#fff;color:var(--ink);border-radius:16px;padding:18px 30px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.joininfo .url{font-size:1.3em;font-weight:800;word-break:break-all}
.joininfo .pinlabel{margin-top:10px;font-weight:700;color:var(--muted)}
.joininfo .pin{font-size:clamp(3em,9vw,6em);font-weight:900;letter-spacing:.06em;line-height:1}
.qr{background:#fff;border-radius:16px;padding:10px;line-height:0}
.qr svg{width:180px;height:180px}
.lobby-mid{display:flex;align-items:center;gap:16px;padding:0 24px}
.lobby-mid h2{flex:1;text-align:center;margin:0}
.count{background:rgba(0,0,0,.3);border-radius:10px;padding:.5em 1em;font-weight:800;font-size:1.2em}
.names{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:26px}
.names .nm{background:#fff;color:var(--ink);font-weight:800;border-radius:10px;padding:.5em 1em;font-size:1.25em;border:0;animation:pop .3s}
.names .nm.off{opacity:.45}
.names .nm:hover{text-decoration:line-through}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.hq{flex:1;display:flex;flex-direction:column;padding:16px;gap:14px}
.hq-text{background:#fff;color:var(--ink);border-radius:12px;padding:16px 22px;text-align:center;font-size:clamp(1.3em,3vw,2.2em);font-weight:800;word-break:break-word}
.hq-mid{flex:1;display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:160px}
.hq-mid .side{width:130px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.timer{width:110px;height:110px;border-radius:50%;background:var(--c4);display:flex;align-items:center;justify-content:center;font-size:2.8em;font-weight:900}
.answered{font-size:2.6em;line-height:1}
.hq-img{flex:1;display:flex;justify-content:center;align-items:center}
.hq-img img{max-width:100%;max-height:42vh;border-radius:10px;background:#fff}
.hq-hint{flex:1;text-align:center;font-size:1.6em;font-weight:800}
.hq-hint .big{font-size:3em;display:block}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:10px;color:#fff;font-weight:800;font-size:clamp(1em,2.4vw,1.6em);padding:18px;display:flex;align-items:center;gap:12px;text-align:left;min-height:90px;box-shadow:0 5px 0 rgba(0,0,0,.25);word-break:break-word}
.tile .shape{font-size:1.5em}
.tile.dim{opacity:.3}
.tile.sel{outline:6px solid #fff;outline-offset:-6px}
.tile .ok{margin-left:auto;font-size:1.4em}
.ready{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:20px}
.ready .qt{font-size:clamp(1.6em,4vw,3em);font-weight:900;max-width:1000px}
.ready .pill{background:#fff;color:var(--ink);border-radius:30px;padding:.4em 1.2em;font-weight:800}
.bar3{width:min(600px,80vw);height:12px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden}
.bar3 i{display:block;height:100%;background:var(--accent);animation:fill 3s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
.reveal-body{flex:1;display:flex;align-items:flex-end;justify-content:center;gap:16px;padding:10px;min-height:260px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:min(150px,22vw);height:38vh}
.col .cnt{font-weight:900;font-size:1.6em;margin-bottom:4px}
.col .b{width:100%;border-radius:8px 8px 0 0;min-height:8px;transition:height .6s}
.col .lab{width:100%;border-radius:0 0 8px 8px;padding:6px;text-align:center;font-weight:800;font-size:1.1em}
.summary{text-align:center;font-weight:800;font-size:1.3em}
.cloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 18px;background:#fff;border-radius:14px;padding:24px;max-width:1000px;margin:0 auto;align-self:center}
.cloud span{font-weight:800;line-height:1.1}
.opengrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;width:100%;align-self:flex-start;max-height:55vh;overflow:auto}
.opengrid div{background:#fff;color:var(--ink);border-radius:10px;padding:12px;font-weight:600;word-break:break-word}
.typelist{background:#fff;color:var(--ink);border-radius:14px;padding:12px 20px;min-width:min(520px,90vw);align-self:center}
.typelist .r{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700;font-size:1.2em}
.typelist .r.ok{color:var(--ok)}
.nline{position:relative;width:min(900px,90vw);height:150px;align-self:center}
.nline .axis{position:absolute;left:0;right:0;top:100px;height:6px;background:#fff;border-radius:3px}
.nline .band{position:absolute;top:84px;height:38px;background:rgba(38,137,12,.65);border:2px solid #7cff5c;border-radius:6px;transform:translateX(-50%);min-width:6px}
.nline .dot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--accent);border:2px solid #fff;transform:translate(-50%,-50%)}
.nline .tk{position:absolute;top:116px;transform:translateX(-50%);font-weight:800}
.nline .cv{position:absolute;top:0;transform:translateX(-50%);background:var(--ok);padding:.3em .7em;border-radius:8px;font-weight:900;font-size:1.3em;white-space:nowrap}
.orderlist{background:#fff;color:var(--ink);border-radius:14px;padding:12px 20px;min-width:min(520px,90vw);align-self:center;font-size:1.25em;font-weight:700}
.orderlist div{padding:6px 0;border-bottom:1px solid var(--line)}
.pinview{position:relative;display:inline-block;align-self:center}
.pinview img{display:block;max-width:90vw;max-height:52vh;border-radius:10px}
.pinview .dot{position:absolute;width:18px;height:18px;border-radius:50%;border:2px solid #fff;transform:translate(-50%,-50%)}
.board{width:min(760px,94vw);margin:20px auto;display:flex;flex-direction:column;gap:10px}
.board .r{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:10px;padding:12px 18px;font-weight:800;font-size:1.35em;animation:pop .3s}
.board .r .rk{width:1.6em}
.board .r .nm{flex:1;word-break:break-word}
.board .r .gain{color:var(--ok);font-size:.75em}
.board .r.first{background:var(--accent)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:20px;min-height:46vh}
.pod{display:flex;flex-direction:column;align-items:center;width:min(220px,28vw);animation:rise .8s ease-out both}
.pod .nm{font-weight:900;font-size:1.4em;text-align:center;margin-bottom:8px;word-break:break-word}
.pod .blk{width:100%;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:12px;font-weight:900;font-size:2.4em}
.pod .blk small{font-size:.4em}
.pod.p1 .blk{height:34vh;background:var(--accent);color:#3a2300}
.pod.p2 .blk{height:24vh;background:#d9d9e3;color:#333}
.pod.p3 .blk{height:17vh;background:#d08a4b;color:#3a1d00}
.pod.p1{animation-delay:1.6s}.pod.p2{animation-delay:.9s}.pod.p3{animation-delay:.2s}
@keyframes rise{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
table.res{width:100%;border-collapse:collapse;color:var(--ink)}
table.res th,table.res td{padding:8px;border-bottom:1px solid var(--line);text-align:left}
.hfoot{display:flex;justify-content:flex-end;gap:10px;padding:14px 18px}
.slideview{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
.slideview .st{font-size:clamp(1.8em,4vw,3.2em);font-weight:900}
.slideview .sb{font-size:clamp(1.1em,2.2vw,1.7em);max-width:1000px;white-space:pre-wrap;background:#fff;color:var(--ink);border-radius:14px;padding:18px 26px}
.slideview .sb:empty{display:none}
.slideview img{max-width:90vw;max-height:45vh;border-radius:10px}
/* player */
.pl{min-height:100vh;display:flex;flex-direction:column}
.pbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(0,0,0,.3);font-weight:800}
.pbar .sc{background:#fff;color:var(--ink);border-radius:8px;padding:.2em .7em}
.tbar{height:8px;background:rgba(255,255,255,.2)}
.tbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.pbody{flex:1;display:flex;flex-direction:column;padding:14px;gap:14px}
.pq{background:#fff;color:var(--ink);border-radius:12px;padding:12px 16px;text-align:center;font-weight:800;font-size:1.2em;word-break:break-word}
.pimg{text-align:center}.pimg img{max-width:100%;max-height:30vh;border-radius:10px;background:#fff}
.pbody .tiles{flex:1}
.pbody .tile{min-height:80px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px}
.center h1{margin:0;font-size:2.2em}
.center .emo{font-size:4.5em;line-height:1}
.joinbox{background:#fff;color:var(--ink);border-radius:16px;padding:22px;width:min(380px,92vw);display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.joinbox input{border:2px solid var(--line);border-radius:10px;padding:.7em;font-size:1.3em;font-weight:800;text-align:center}
.fb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px}
.fb.good{background:var(--ok)}.fb.badc{background:var(--bad)}.fb.neutral{background:transparent}
.fb h1{font-size:2.6em;margin:0}
.fb .gain{background:rgba(0,0,0,.25);border-radius:10px;padding:.4em 1.2em;font-size:1.6em;font-weight:900}
.fb .corr{background:rgba(255,255,255,.95);color:var(--ink);border-radius:10px;padding:10px 16px;font-weight:700;max-width:90vw;word-break:break-word}
.bigin{width:100%;border:0;border-radius:12px;padding:.8em;font-size:1.4em;font-weight:700;text-align:center;color:var(--ink)}
textarea.bigin{min-height:140px;text-align:left;font-size:1.15em}
.slval{text-align:center;font-size:3em;font-weight:900}
input[type=range].bigr{width:100%;height:44px;accent-color:var(--accent)}
.slminmax{display:flex;justify-content:space-between;font-weight:700;opacity:.85}
.order{display:flex;flex-direction:column;gap:8px}
.ord-item{display:flex;align-items:center;gap:10px;border-radius:10px;padding:10px;color:#fff;font-weight:800;font-size:1.1em}
.ord-item .num{background:rgba(0,0,0,.25);border-radius:50%;width:1.8em;height:1.8em;display:flex;align-items:center;justify-content:center;flex:none}
.ord-item .txt{flex:1;word-break:break-word}
.ord-item button{border:0;border-radius:8px;width:44px;height:40px;font-size:1.1em;background:rgba(255,255,255,.9)}
.ord-item button:disabled{opacity:.3}
.pinwrap{position:relative;align-self:center;line-height:0;user-select:none;touch-action:manipulation}
.pinwrap img{max-width:100%;max-height:55vh;border-radius:10px;display:block}
.pinmark{position:absolute;font-size:34px;line-height:1;transform:translate(-50%,-100%);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.submitrow{display:flex;justify-content:center}
.spinner{width:56px;height:56px;border-radius:50%;border:6px solid rgba(255,255,255,.25);border-top-color:#fff;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
footer.f{text-align:center;opacity:.6;font-size:.85em;padding:20px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="filein" hidden>
<script>
"use strict";

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function download(name,text,type){const b=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function slug(s){return (norm(s)||'kviz').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'kviz';}
function modal(html,onClose){const bg=document.createElement('div');bg.className='modal-bg';bg.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(bg);const close=()=>{bg.remove();onClose&&onClose();};bg.addEventListener('click',e=>{if(e.target===bg)close();});return {el:bg,close};}

const CYR={'а':'a','б':'b','в':'v','г':'g','д':'d','ђ':'dj','е':'e','ж':'z','з':'z','и':'i','ј':'j','к':'k','л':'l','љ':'lj','м':'m','н':'n','њ':'nj','о':'o','п':'p','р':'r','с':'s','т':'t','ћ':'c','у':'u','ф':'f','х':'h','ц':'c','ч':'c','џ':'dz','ш':'s','ѓ':'g','ќ':'k','ѕ':'dz','й':'j','щ':'sht','ъ':'a','ь':'','ю':'ju','я':'ja','ы':'y','э':'e','ё':'e'};
function norm(s){s=String(s??'').toLowerCase().trim().replace(/đ/g,'dj');s=[...s].map(c=>CYR[c]??c).join('');s=s.normalize('NFD').replace(/[̀-ͯ]/g,'');return s.replace(/[.,!?;:"'()„“”‘’«»]/g,'').replace(/\s+/g,' ').trim();}

/* ================= question model ================= */
const TYPES={quiz:{icon:'🔘',scored:true},multi:{icon:'☑️',scored:true},tf:{icon:'⚖️',scored:true},type:{icon:'⌨️',scored:true},slider:{icon:'🎚️',scored:true},order:{icon:'🧩',scored:true},pin:{icon:'📍',scored:true},poll:{icon:'📊',scored:false},cloud:{icon:'☁️',scored:false},open:{icon:'💬',scored:false},slide:{icon:'🖼️',scored:false}};
const TIMES=[5,10,15,20,30,45,60,90,120,180,240];
function defaultsFor(type){switch(type){
case 'quiz':return {answers:[0,1,2,3].map(i=>({text:'',correct:i===0}))};
case 'multi':return {answers:[0,1,2,3].map(i=>({text:'',correct:i<2}))};
case 'poll':return {answers:[0,1,2,3].map(()=>({text:''}))};
case 'tf':return {correct:true};
case 'type':return {accepted:[''],maxLen:30};
case 'slider':return {min:0,max:100,step:1,correct:50,tol:0,unit:''};
case 'order':return {items:['','','','']};
case 'pin':return {target:{x:.5,y:.5},radius:.1,aspect:.75};
case 'cloud':return {maxLen:25};
case 'open':return {maxLen:250};
case 'slide':return {body:''};}return {};}
function newQuestion(type){return Object.assign({id:uid(),type,text:'',image:'',time:20,points:TYPES[type].scored?1:0},defaultsFor(type));}
function changeType(q,type){const keep={id:q.id,type,text:q.text,image:q.image,time:q.time||20,points:TYPES[type].scored?(q.points||1):0};const d=defaultsFor(type);
 if(q.answers&&d.answers){d.answers=q.answers.map(a=>type==='poll'?{text:a.text}:{text:a.text,correct:type==='multi'?!!a.correct:false});if(type==='quiz'){const ci=q.answers.findIndex(a=>a.correct);d.answers[ci<0?0:ci].correct=true;}}
 if(q.type==='pin'&&type==='pin') Object.assign(d,{target:q.target,radius:q.radius,aspect:q.aspect});
 return Object.assign(keep,d);}
const isScored=q=>TYPES[q.type].scored&&q.points>0;
function problem(q){
 const filled=(q.answers||[]).filter(a=>a.text.trim());
 if(q.type==='slide') return (q.text.trim()||q.body.trim()||q.image)?null:'problem_text';
 if(!q.text.trim()&&!q.image) return 'problem_text';
 switch(q.type){
 case 'quiz':case 'multi':if(filled.length<2)return 'problem_answers';if(!filled.some(a=>a.correct))return 'problem_correct';break;
 case 'poll':if(filled.length<2)return 'problem_answers';break;
 case 'type':if(!q.accepted.some(a=>a.trim()))return 'problem_accepted';break;
 case 'slider':{const mn=+q.min,mx=+q.max,c=+q.correct,s=+q.step;if(!(mn<mx)||!(c>=mn&&c<=mx)||!(s>0)||isNaN(+q.tol))return 'problem_slider';break;}
 case 'order':if(q.items.filter(s=>s.trim()).length<2)return 'problem_items';break;
 case 'pin':if(!q.image)return 'problem_image';break;}
 return null;}
function evaluate(q,v){
 if(v===undefined||v===null) return TYPES[q.type].scored?false:null;
 switch(q.type){
 case 'quiz':return !!(q.answers[v]&&q.answers[v].correct);
 case 'multi':{if(!Array.isArray(v))return false;const c=q.answers.map((a,i)=>a.correct?i:-1).filter(i=>i>=0);const s=[...new Set(v.map(Number))].sort((a,b)=>a-b);return s.length===c.length&&s.every((x,i)=>x===c[i]);}
 case 'tf':return v===q.correct;
 case 'type':return q.accepted.some(a=>a.trim()&&norm(a)===norm(v));
 case 'slider':return Math.abs(Number(v)-Number(q.correct))<=Number(q.tol||0)+1e-9;
 case 'order':return Array.isArray(v)&&v.length===q.items.length&&v.every((x,i)=>x===i);
 case 'pin':{if(typeof v!=='object')return false;const dx=v.x-q.target.x,dy=(v.y-q.target.y)*(q.aspect||1);return Math.hypot(dx,dy)<=q.radius;}
 default:return null;}}
function calcPoints(q,ms){const T=q.time*1000;const f=Math.min(1,Math.max(0,ms/T));return Math.round(1000*(1-f/2))*q.points;}
function correctText(q){switch(q.type){
 case 'quiz':case 'multi':return q.answers.filter(a=>a.correct).map(a=>a.text).join(', ');
 case 'tf':return t(q.correct?'true':'false');
 case 'type':return q.accepted.filter(a=>a.trim()).join(' / ');
 case 'slider':return q.correct+(q.unit?' '+q.unit:'')+(+q.tol?` (±${q.tol})`:'');
 case 'order':return q.items.join(' → ');
 default:return '';}}
function publicQ(q,opts){
 const p={type:q.type,text:opts.showText?q.text:'',time:q.time};
 if(['quiz','multi','poll'].includes(q.type)) p.answers=q.answers.map(a=>opts.showText?a.text:'');
 if(q.type==='slider') Object.assign(p,{min:+q.min,max:+q.max,step:+q.step,unit:q.unit});
 if(q.type==='order'){let it=q.items.map((s,i)=>({id:i,text:s}));for(let k=0;k<10;k++){it=shuffle(it);if(it.some((x,i)=>x.id!==i))break;}p.items=it;}
 if(q.type==='pin'){p.image=q.image;p.aspect=q.aspect;}
 if(['type','cloud','open'].includes(q.type)) p.maxLen=q.maxLen;
 if(q.type==='slide') p.body=q.body;
 if(opts.withImage&&q.image) p.image=q.image;
 return p;}
function prepareQuiz(quiz){
 const all=quiz.questions;const bad=all.filter(problem).length;const good=all.filter(q=>!problem(q));
 if(!good.length){alert(t('noValidQ'));return null;}
 if(bad&&!confirm(t('incompleteWarn',{n:bad})))return null;
 const s=Object.assign({shuffleQ:false,shuffleA:false,streak:true,showText:true},quiz.settings||{});
 let qs=clone(good).map(q=>{
  if(q.answers) q.answers=q.answers.filter(a=>a.text.trim());
  if(q.type==='order') q.items=q.items.filter(x=>x.trim());
  if(q.type==='type') q.accepted=q.accepted.filter(x=>x.trim());
  if(s.shuffleA&&q.answers&&q.type!=='poll') q.answers=shuffle(q.answers);
  return q;});
 if(s.shuffleQ) qs=shuffle(qs);
 return {settings:s,qs,title:quiz.title||t('untitled')};}

/* ================= networking ================= */
function peerOk(){return LOCAL||typeof Peer!=='undefined';}
function makeHostNet(pin,h){
 if(LOCAL){const bc=new BroadcastChannel('ka-'+pin);bc.onmessage=e=>{const d=e.data;if(d.k==='c2h')h.msg(d.cid,d.m);else if(d.k==='bye')h.close(d.cid);};setTimeout(()=>h.ready(),30);
  return {send(cid,m){bc.postMessage({k:'h2c',cid,m});},close(){bc.close();}};}
 const conns=new Map();const peer=new Peer(PEER_PREFIX+pin,{debug:0});let closed=false;
 peer.on('open',()=>h.ready());
 peer.on('connection',conn=>{const cid=uid();conns.set(cid,conn);conn.on('data',d=>h.msg(cid,d));conn.on('close',()=>{conns.delete(cid);h.close(cid);});conn.on('error',()=>{});});
 peer.on('error',e=>h.error(e));
 peer.on('disconnected',()=>{if(!closed)setTimeout(()=>{try{peer.reconnect();}catch(e){}},1000);});
 return {send(cid,m){const c=conns.get(cid);if(c&&c.open){try{c.send(m);}catch(e){}}},close(){closed=true;try{peer.destroy();}catch(e){}}};}
function makePlayerNet(pin,h){
 if(LOCAL){const cid=uid();const bc=new BroadcastChannel('ka-'+pin);bc.onmessage=e=>{const d=e.data;if(d.k==='h2c'&&d.cid===cid)h.msg(d.m);};setTimeout(()=>h.open(),30);
  const bye=()=>{try{bc.postMessage({k:'bye',cid});}catch(e){}};addEventListener('pagehide',bye);
  return {send(m){bc.postMessage({k:'c2h',cid,m});},close(){bye();bc.close();}};}
 const peer=new Peer({debug:0});let conn=null;
 peer.on('open',()=>{conn=peer.connect(PEER_PREFIX+pin,{reliable:true});conn.on('open',()=>h.open());conn.on('data',d=>h.msg(d));conn.on('close',()=>h.close());conn.on('error',()=>{});});
 peer.on('error',e=>h.error(e));
 return {send(m){if(conn&&conn.open){try{conn.send(m);}catch(e){}}},close(){try{peer.destroy();}catch(e){}}};}

let H=null;
function hostGame(quizId){

 if(!peerOk()){alert(t('netMissing'));return;}
 const prep=prepareQuiz(quiz);if(!prep)return;
 H={quiz:prep,title:prep.title,settings:prep.settings,quizId,i:-1,players:new Map(),cidToPid:new Map(),banned:new Set(),state:'connecting',answers:new Map(),timer:null,net:null,pin:null};

function hostConnect(){

  ready(){if(H!==myH)return;if(H.state==='connecting'){H.state='lobby';renderLobby();}},
  msg(cid,m){if(H===myH)hostMsg(cid,m);},
  close(cid){if(H!==myH)return;const pid=H.cidToPid.get(cid);const p=pid&&H.players.get(pid);if(p&&p.cid===cid){p.online=false;p.cid=null;if(H.state==='lobby')renderLobbyNames();else maybeAllAnswered();}},
  error(e){if(H!==myH)return;if(e&&e.type==='unavailable-id'&&H.state==='connecting'){H.net.close();hostConnect();return;}
   if(H.state==='connecting'){view(`<div class="host"><div class="center"><div class="emo">⚠️</div><h2>${esc(t('netError',{e:(e&&(e.type||e.message))||e}))}</h2><button class="btn" id="h-cancel">${esc(t('home'))}</button></div></div>`);$('#h-cancel').onclick=hostExit;}
   else toast(t('netError',{e:(e&&(e.type||e.message))||e}));}});}
function hostExit(){if(H){clearInterval(H.timer);clearTimeout(H.readyT);try{H.net&&H.net.close();}catch(e){}}H=null;if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});renderHome();}
function joinUrl(){const u=new URL(location.href);u.search='';u.hash='';u.searchParams.set('pin',H.pin);if(LOCAL)u.searchParams.set('local','1');return u.toString();}
function hbar(extra){return `<div class="hbar"><span>🎯 ${esc(H.title)}</span><span class="spacer"></span>${extra||''}<span>PIN: ${H.pin}</span><button class="btn small dark" id="h-fs" title="${esc(t('fullscreen'))}">⛶</button><button class="btn small dark" id="h-x" title="${esc(t('home'))}">✕</button></div>`;}

function renderLobby(){

 try{if(typeof qrcode!=='undefined'){const q=qrcode(0,'M');q.addData(url);q.make();qr=q.createSvgTag({cellSize:4,margin:2,scalable:true});}}catch(e){}

function renderLobbyNames(){const el=$('#h-names');if(!el)return;const ps=[...H.players.values()];
 el.innerHTML=ps.length?ps.map(p=>`<button class="nm ${p.online?'':'off'}" data-pid="${esc(p.pid)}">${esc(p.name)}</button>`).join(''):`<div class="note">${esc(t('nobody'))}</div>`;

function sanitize(v){if(typeof v==='string')return v.slice(0,500);if(typeof v==='number'||typeof v==='boolean')return v;if(Array.isArray(v))return v.slice(0,10).map(Number);if(v&&typeof v==='object')return {x:Number(v.x),y:Number(v.y)};return undefined;}
function hostMsg(cid,m){
 if(!m||typeof m!=='object')return;
 if(m.t==='join'){
  const pid=String(m.pid||cid).slice(0,40);
  if(H.banned.has(pid)){H.net.send(cid,{t:'kicked'});return;}
  let p=H.players.get(pid);
  if(!p){const base=String(m.name||'').trim().slice(0,20)||t('player');const names=new Set([...H.players.values()].map(x=>x.name.toLowerCase()));let nm=base,k=2;while(names.has(nm.toLowerCase()))nm=base+' '+(k++);
   p={pid,name:nm,score:0,streak:0,res:[],online:true,cid};H.players.set(pid,p);}
  else{p.online=true;p.cid=cid;}
  H.cidToPid.set(cid,pid);
  H.net.send(cid,{t:'welcome',name:p.name,title:H.title,score:p.score});
  if(H.state==='lobby')renderLobbyNames();
  else if(H.state==='question'&&!H.answers.has(pid)){const left=H.cur.time-(Date.now()-H.qStart)/1000;H.net.send(cid,Object.assign({},H.curMsg,{left}));}
  else if(H.state==='podium')sendEnd(p,rankPlayers());

 }else if(m.t==='ans'){
  const pid=H.cidToPid.get(cid);const p=pid&&H.players.get(pid);if(!p||H.players.get(pid).cid!==cid)return;
  if(H.state!=='question'||m.i!==H.i||H.answers.has(pid))return;
  H.answers.set(pid,{v:sanitize(m.v),ms:Date.now()-H.qStart});

function hostEndQuestion(){

function bars(items){const mx=Math.max(1,...items.map(x=>x.n));return items.map(x=>`<div class="col"><div class="cnt">${x.n}${x.correct?' ✓':''}</div><div class="b c${x.c}" style="height:${Math.round(x.n/mx*75)+3}%;${x.dim?'opacity:.35':''}"></div><div class="lab c${x.c}" style="${x.dim?'opacity:.35':''}">${x.shape||SHAPES[x.c]} ${esc(x.label).slice(0,40)}</div></div>`).join('');}

  return bars(q.answers.map((a,i)=>({label:a.text,n:cnt[i],correct:q.type!=='poll'&&a.correct,dim:q.type!=='poll'&&!a.correct,c:i})));}
 case 'tf':{const y=vals.filter(v=>v===true).length,n=vals.filter(v=>v===false).length;return bars([{label:t('true'),n:y,correct:q.correct,dim:!q.correct,c:1,shape:'▲'},{label:t('false'),n,correct:!q.correct,dim:q.correct,c:0,shape:'◆'}]);}
 case 'type':case 'cloud':{const g=new Map();vals.forEach(v=>{if(typeof v!=='string'||!v.trim())return;const k=norm(v);const e=g.get(k)||{text:v.trim(),n:0};e.n++;g.set(k,e);});const list=[...g.values()].sort((a,b)=>b.n-a.n);

  const mx=list[0].n;const cols=['#e21b3c','#1368ce','#d89e00','#26890c','#864cbf','#0a8f8f','#c2185b','#5d4037'];
  return `<div class="cloud">${shuffle(list.slice(0,60)).map((e,i)=>`<span style="font-size:${(1+2.6*(e.n/mx)).toFixed(2)}em;color:${cols[i%cols.length]}">${esc(e.text)}</span>`).join('')}</div>`;}

 case 'slider':{const mn=+q.min,mx=+q.max;const pct=v=>((v-mn)/(mx-mn)*100);const stack={};
  const dots=vals.filter(v=>typeof v==='number'&&isFinite(v)).map(v=>{const k=Math.round(pct(v));stack[k]=(stack[k]||0)+1;return `<div class="dot" style="left:${pct(v)}%;top:${80-(stack[k]-1)*14}px"></div>`;}).join('');
  const tol=+q.tol||0;return `<div class="nline"><div class="axis"></div><div class="band" style="left:${pct(+q.correct)}%;width:${Math.max(0.6,tol*2/(mx-mn)*100)}%"></div>${dots}<div class="cv" style="left:${pct(+q.correct)}%">${esc(correctText(q))}</div><div class="tk" style="left:0">${mn}</div><div class="tk" style="left:100%">${mx}</div></div>`;}
 case 'order':return `<div class="orderlist">${q.items.map((s,i)=>`<div>${i+1}. ${esc(s)}</div>`).join('')}</div>`;
 case 'pin':{const z=`<div class="pinzone" style="left:${q.target.x*100}%;top:${q.target.y*100}%;width:${q.radius*200}%"></div>`;
  const dots=vals.filter(v=>v&&typeof v==='object').map(v=>`<div class="dot" style="left:${v.x*100}%;top:${v.y*100}%;background:${evaluate(q,v)?'#26890c':'#e21b3c'}"></div>`).join('');
  return `<div class="pinview"><img src="${esc(q.image)}" alt="">${z}${dots}</div>`;}}
 return '';}
function renderHostReveal(q){
 const scoredT=TYPES[q.type].scored;const total=H.players.size;const c=[...H.players.values()].filter(p=>p.res[H.i]&&p.res[H.i].ok).length;
 view(`<div class="host">${hbar(`<span>${esc(t('questionNofM',{i:H.i+1,n:H.quiz.qs.length}))}</span>`)}<div class="hq">
  <div class="hq-text">${esc(q.text)}</div>
  <div class="reveal-body">${revealBody(q)}</div>
  ${scoredT?`<div class="summary">${esc(t('correctN',{c,n:total}))}</div>`:''}
 </div><div class="hfoot"><button class="btn primary big" id="h-next">${esc(t('next'))} ▶</button></div></div>`);
 bindHbar();$('#h-next').onclick=()=>{if(isScored(q)&&H.i<H.quiz.qs.length-1)renderBoard();else hostNext();};}
function renderBoard(){
 H.state='board';const r=rankPlayers().slice(0,5);
 view(`<div class="host">${hbar()}<h1 style="text-align:center;margin:18px 0 0">${esc(t('scoreboard'))}</h1><div class="board">${r.map((p,i)=>{const g=p.res[H.i]?p.res[H.i].gained:0;return `<div class="r ${i===0?'first':''}" style="animation-delay:${i*.08}s"><span class="rk">${i+1}.</span><span class="nm">${esc(p.name)}${p.streak>1?' 🔥'+p.streak:''}</span>${g?`<span class="gain">+${g}</span>`:''}<span>${p.score}</span></div>`;}).join('')}</div><div class="spacer"></div><div class="hfoot"><button class="btn primary big" id="h-next">${esc(t('next'))} ▶</button></div></div>`);
 bindHbar();$('#h-next').onclick=hostNext;}
function sendEnd(p,ranked){if(p.online&&p.cid)H.net.send(p.cid,{t:'end',rank:ranked.indexOf(p)+1,score:p.score,n:ranked.length});}
function hostPodium(){
 H.state='podium';const r=rankPlayers();r.forEach(p=>sendEnd(p,r));
 const pod=(p,k)=>p?`<div class="pod p${k}"><div class="nm">${esc(p.name)}</div><div class="blk">${k}<small>${p.score}</small></div></div>`:'';
 const scoredIdx=H.quiz.qs.map((q,i)=>TYPES[q.type].scored?i:-1).filter(i=>i>=0);
 view(`<div class="host">${hbar()}<h1 style="text-align:center;margin:16px 0 0">🏆 ${esc(t('gameOver'))}</h1>
  <div class="podium">${pod(r[1],2)}${pod(r[0],1)}${pod(r[2],3)}</div>
  <div class="wrap" style="width:100%"><div class="card"><h3 style="margin-top:0">${esc(t('results'))}</h3><table class="res"><tr><th>#</th><th>${esc(t('player'))}</th><th>${esc(t('score'))}</th><th>${esc(t('correctCount'))}</th></tr>${r.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${p.score}</td><td>${scoredIdx.filter(k=>p.res[k]&&p.res[k].ok).length} / ${scoredIdx.length}</td></tr>`).join('')}</table>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" id="h-csv">⬇ ${esc(t('downloadCsv'))}</button><button class="btn dark" id="h-again">🔁 ${esc(t('retry'))}</button><button class="btn" id="h-home" style="border:1px solid var(--line)">🏠 ${esc(t('home'))}</button></div></div></div></div>`);
 bindHbar();$('#h-csv').onclick=exportCsv;$('#h-home').onclick=hostExit;$('#h-again').onclick=()=>{const id=H.quizId;hostExit();hostGame(id);};}
function fmtAns(q,v){if(v===undefined)return '';switch(q.type){case 'quiz':case 'poll':return q.answers[v]?q.answers[v].text:'';case 'multi':return Array.isArray(v)?v.map(i=>q.answers[i]?q.answers[i].text:'').join(' + '):'';case 'tf':return t(v?'true':'false');case 'order':return Array.isArray(v)?v.map(i=>q.items[i]).join(' > '):'';case 'pin':return v?`(${Math.round(v.x*100)}%, ${Math.round(v.y*100)}%)`:'';default:return String(v);}}
function exportCsv(){
 const qs=H.quiz.qs;const cell=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const r=rankPlayers();
 const idx=qs.map((q,i)=>q.type==='slide'?-1:i).filter(i=>i>=0);
 const head=['#',t('player'),t('score'),t('correctCount'),...idx.map(i=>`${i+1}. ${qs[i].text}`)];
 const rows=r.map((p,k)=>[k+1,p.name,p.score,idx.filter(i=>p.res[i]&&p.res[i].ok).length,...idx.map(i=>{const x=p.res[i];if(!x)return '';const mark=x.ok===true?'✓ ':x.ok===false?'✗ ':'';return mark+fmtAns(qs[i],x.v)+(x.gained?` (+${x.gained})`:'');})]);
 download(slug(H.title)+'-rezultati.csv','﻿'+[head,...rows].map(row=>row.map(cell).join(';')).join('\r\n'),'text/csv;charset=utf-8');}
addEventListener('beforeunload',e=>{if(H&&H.state!=='lobby'&&H.state!=='podium'&&H.state!=='connecting'){e.preventDefault();e.returnValue='';}});

/* ================= PLAYER ================= */
let P=null;
function renderJoin(pin){
 document.documentElement.lang=LANG;
 const lastName=localStorage.getItem('ka.name')||'';
 view(`<div class="pl"><div class="topbar"><div class="logo">🎯 ${esc(t('appName'))}</div><div class="spacer"></div>${langSelect()}</div>
  <div class="center"><form class="joinbox" id="j-form"><input id="j-pin" inputmode="numeric" pattern="[0-9 ]*" maxlength="7" placeholder="${esc(t('enterPin'))}" value="${esc(pin)}" autocomplete="off"><input id="j-name" maxlength="20" placeholder="${esc(t('enterName'))}" value="${esc(lastName)}" autocomplete="off"><button class="btn primary big" type="submit">${esc(t('enter'))}</button></form>
  ${PARAMS.get('pin')?'':`<button class="btn dark small" id="j-back">← ${esc(t('home'))}</button>`}</div></div>`);
 bindLang(()=>renderJoin($('#j-pin').value));
 if($('#j-back'))$('#j-back').onclick=renderHome;
 setTimeout(()=>(pin?$('#j-name'):$('#j-pin')).focus(),50);
 $('#j-form').onsubmit=e=>{e.preventDefault();const p=$('#j-pin').value.replace(/\D/g,'');const n=$('#j-name').value.trim();if(p.length!==6){$('#j-pin').focus();return;}if(!n){$('#j-name').focus();return;}localStorage.setItem('ka.name',n);playerConnect(p,n);};}
function playerConnect(pin,name){
 if(!peerOk()){alert(t('netMissing'));return;}
 if(P&&P.net)P.net.close();
 let pid=sessionStorage.getItem('ka.pid.'+pin);if(!pid){pid=uid();sessionStorage.setItem('ka.pid.'+pin,pid);}
 P={pin,name,pid,score:0,state:'connecting',welcomed:false};const me=P;
 plCenter(`<div class="spinner"></div><h2>${esc(t('connecting'))}</h2>`);
 P.net=makePlayerNet(pin,{
  open(){if(P===me)P.net.send({t:'join',name,pid});},
  msg(m){if(P===me)playerMsg(m);},
  close(){if(P===me&&!['end','kicked'].includes(P.state))playerError(t('connLost'),true);},
  error(e){if(P!==me)return;if(e&&e.type==='peer-unavailable')playerError(t('gameNotFound'),false);else if(!['end','kicked'].includes(P.state))playerError(t('netError',{e:(e&&(e.type||e.message))||e}),true);}});
 clearTimeout(P.to);P.to=setTimeout(()=>{if(P===me&&!P.welcomed){P.net.close();playerError(t('gameNotFound'),false);}},LOCAL?4000:15000);}
function pbar(){return `<div class="pbar"><span>${esc(P.name)}</span><span class="spacer"></span><span class="sc">${P.score}</span></div>`;}
function plCenter(inner,withBar){clearInterval(P&&P.tick);view(`<div class="pl">${withBar&&P&&P.welcomed?pbar():''}<div class="center">${inner}</div></div>`);}
function playerError(msg,canRetry){if(!P)return;clearTimeout(P.to);P.state='error';const {pin,name}=P;
 plCenter(`<div class="emo">😕</div><h2>${esc(msg)}</h2>${canRetry?`<button class="btn primary big" id="p-retry">${esc(t('tryAgain'))}</button>`:''}<button class="btn dark" id="p-home">${esc(t('back'))}</button>`);
 if($('#p-retry'))$('#p-retry').onclick=()=>playerConnect(pin,name);
 $('#p-home').onclick=()=>{try{P.net.close();}catch(e){}P=null;renderJoin(pin);};}
function playerMsg(m){
 if(!m||typeof m!=='object')return;
 switch(m.t){
 case 'welcome':clearTimeout(P.to);P.welcomed=true;P.name=m.name;P.score=m.score||0;P.state='lobby';
  plCenter(`<div class="emo">🎉</div><h1>${esc(t('youreIn'))}</h1><h2 style="margin:0">${esc(P.name)}</h2><p>${esc(t('seeName'))}</p><p class="note">${esc(m.title)}</p>`,true);break;
 case 'ready':P.state='ready';plCenter(`<div class="pill" style="background:#fff;color:var(--ink);border-radius:30px;padding:.4em 1.2em;font-weight:800">${esc(t('questionNofM',{i:m.i+1,n:m.n}))}</div><h1>${esc(t('getReady'))}</h1><div class="spinner"></div>`,true);break;
 case 'q':playerQuestion(m);break;
 case 'got':P.state='sent';plCenter(`<div class="spinner"></div><h2>${esc(t('answerSent'))}</h2><p>${esc(t('waitOthers'))}</p>`,true);break;
 case 'res':playerResult(m);break;
 case 'slide':case 'wait':P.state='wait';plCenter(`<div class="emo">👀</div><h2>${esc(t('lookAtScreen'))}</h2>`,true);break;
 case 'end':P.state='end';P.score=m.score;plCenter(`<div class="emo">${m.rank===1?'🏆':m.rank<=3?'🥇🥈🥉'.slice((m.rank-1)*2,(m.rank)*2):'⭐'}</div><h1>${esc(t('gameOver'))}</h1><h2 style="margin:0">${esc(t('place',{n:m.rank}))} ${esc(t('of'))} ${m.n}</h2><p style="font-size:1.3em;font-weight:800">${esc(t('yourScore',{n:m.score}))}</p><button class="btn dark" id="p-home">${esc(t('home'))}</button>`,true);
  $('#p-home').onclick=()=>{try{P.net.close();}catch(e){}P=null;location.href=location.pathname+(LOCAL?'?local=1':'');};break;
 case 'kicked':P.state='kicked';clearTimeout(P.to);try{P.net.close();}catch(e){}plCenter(`<div class="emo">🚪</div><h2>${esc(t('kicked'))}</h2><button class="btn dark" id="p-home">${esc(t('home'))}</button>`);$('#p-home').onclick=()=>{P=null;renderJoin('');};break;}}
function playerQuestion(m){
 if(P.answeredI===m.i)return;
 P.state='question';P.qi=m.i;const q=m.q;const total=q.time;const left0=m.left!=null?Math.max(1,m.left):total;const t0=Date.now();
 view(`<div class="pl">${pbar()}<div class="tbar"><i id="p-tb" style="width:${left0/total*100}%"></i></div><div class="pbody">
  <div class="note" style="text-align:center;font-weight:700">${esc(t('questionNofM',{i:m.i+1,n:m.n}))} · <span id="p-sec">${Math.ceil(left0)}</span> s</div>
  ${q.text?`<div class="pq">${esc(q.text)}</div>`:''}<div id="p-ans" style="display:flex;flex-direction:column;gap:14px;flex:1"></div></div></div>`);
 answerUI($('#p-ans'),q,v=>{P.answeredI=m.i;clearInterval(P.tick);P.net.send({t:'ans',i:m.i,v});plCenter(`<div class="spinner"></div><h2>${esc(t('answerSent'))}</h2>`,true);});
 clearInterval(P.tick);P.tick=setInterval(()=>{const left=left0-(Date.now()-t0)/1000;const tb=$('#p-tb'),s=$('#p-sec');if(tb)tb.style.width=Math.max(0,left/total*100)+'%';if(s)s.textContent=Math.max(0,Math.ceil(left));if(left<=0){clearInterval(P.tick);if(P.state==='question')plCenter(`<div class="emo">⏰</div><h2>${esc(t('timeUp'))}</h2>`,true);}},250);}
function playerResult(m){
 P.state='result';P.score=m.score;
 let cls,head,emo;
 if(!m.scored){cls='neutral';emo='💜';head=t('thanks');}
 else if(!m.answered){cls='badc';emo='⏰';head=t('timeUp');}
 else if(m.ok){cls='good';emo='✅';head=t('correctMsg');}
 else{cls='badc';emo='❌';head=t('wrongMsg');}
 clearInterval(P.tick);
 view(`<div class="pl">${pbar()}<div class="fb ${cls}"><div class="emo" style="font-size:4em">${emo}</div><h1>${esc(head)}</h1>
  ${m.scored&&m.ok?`<div class="gain">+${m.gained}</div>`:''}
  ${m.scored&&m.streak>1?`<div style="font-weight:800">${esc(t('streakN',{n:m.streak}))}</div>`:''}
  ${m.scored&&!m.ok&&m.correct?`<div class="corr">${esc(t('correctAnswer'))}: <b>${esc(m.correct)}</b></div>`:''}
  <div style="font-weight:800;font-size:1.2em">${esc(t('place',{n:m.rank}))}</div></div></div>`);}

/* ================= PRACTICE (solo) ================= */
let S=null;
function startPractice(id){const quiz=quizzes.find(q=>q.id===id);if(!quiz)return;const prep=prepareQuiz(quiz);if(!prep)return;
 S={id,qs:prep.qs,settings:prep.settings,title:prep.title,i:-1,score:0,correct:0,streak:0,scoredN:0,tick:null};soloNext();}
function soloExit(){if(S)clearInterval(S.tick);S=null;renderHome();}
function soloBar(){return `<div class="pbar"><button class="btn small dark" id="s-x">✕</button><span>${esc(S.title)}</span><span class="spacer"></span><span class="sc">${S.score}</span></div>`;}
function soloNext(){
 clearInterval(S.tick);S.i++;
 if(S.i>=S.qs.length){const pct=S.scoredN?Math.round(S.correct/S.scoredN*100):100;
  view(`<div class="pl">${soloBar()}<div class="center"><div class="emo">${pct>=80?'🏆':pct>=50?'👍':'💪'}</div><h1>${esc(t('practiceDone'))}</h1><h2 style="margin:0">${esc(t('correctOf',{c:S.correct,n:S.scoredN}))}</h2><p style="font-size:1.4em;font-weight:800">${esc(t('total'))}: ${S.score}</p><div style="display:flex;gap:10px"><button class="btn primary big" id="s-again">🔁 ${esc(t('retry'))}</button><button class="btn dark big" id="s-home">🏠 ${esc(t('home'))}</button></div></div></div>`);
  $('#s-x').onclick=soloExit;$('#s-home').onclick=soloExit;$('#s-again').onclick=()=>startPractice(S.id);return;}
 const q=S.qs[S.i];
 if(q.type==='slide'){view(`<div class="pl">${soloBar()}<div class="slideview"><div class="st">${esc(q.text)}</div>${q.image?`<img src="${esc(q.image)}" alt="">`:''}<div class="sb">${esc(q.body)}</div><button class="btn primary big" id="s-next">${esc(t('next'))} ▶</button></div></div>`);$('#s-x').onclick=soloExit;$('#s-next').onclick=soloNext;return;}
 const p=publicQ(q,{showText:true,withImage:q.type!=='pin'});const t0=Date.now();
 view(`<div class="pl">${soloBar()}<div class="tbar"><i id="s-tb" style="width:100%"></i></div><div class="pbody">
  <div class="note" style="text-align:center;font-weight:700">${esc(t('questionNofM',{i:S.i+1,n:S.qs.length}))} · <span id="s-sec">${q.time}</span> s</div>
  <div class="pq">${esc(q.text)}</div>${p.image&&q.type!=='pin'?`<div class="pimg"><img src="${esc(p.image)}" alt=""></div>`:''}
  <div id="s-ans" style="display:flex;flex-direction:column;gap:14px;flex:1"></div></div></div>`);
 $('#s-x').onclick=soloExit;
 let answered=false;const fin=v=>{if(answered)return;answered=true;clearInterval(S.tick);soloResult(q,v,Date.now()-t0);};
 answerUI($('#s-ans'),p,fin);
 S.tick=setInterval(()=>{const left=q.time-(Date.now()-t0)/1000;const tb=$('#s-tb'),s=$('#s-sec');if(tb)tb.style.width=Math.max(0,left/q.time*100)+'%';if(s)s.textContent=Math.max(0,Math.ceil(left));if(left<=0)fin(undefined);},250);}
function soloResult(q,v,ms){
 const ok=evaluate(q,v);const scored=isScored(q);let gained=0;
 if(TYPES[q.type].scored)S.scoredN++;
 if(ok)S.correct++;
 if(scored){if(ok){S.streak++;gained=calcPoints(q,ms);if(S.settings.streak&&S.streak>1)gained+=Math.min(S.streak-1,5)*100;}else S.streak=0;}
 S.score+=gained;
 let cls,emo,head;
 if(ok===null){cls='neutral';emo='💜';head=t('thanks');}else if(v===undefined){cls='badc';emo='⏰';head=t('timeUp');}else if(ok){cls='good';emo='✅';head=t('correctMsg');}else{cls='badc';emo='❌';head=t('wrongMsg');}
 const ct=correctText(q);
 let extra='';
 if(q.type==='pin')extra=`<div class="pinview" style="margin-top:6px"><img src="${esc(q.image)}" alt="" style="max-height:34vh"><div class="pinzone" style="left:${q.target.x*100}%;top:${q.target.y*100}%;width:${q.radius*200}%"></div>${v?`<div class="dot" style="left:${v.x*100}%;top:${v.y*100}%;background:${ok?'#26890c':'#e21b3c'}"></div>`:''}</div>`;
 view(`<div class="pl">${soloBar()}<div class="fb ${cls}"><div class="emo" style="font-size:4em">${emo}</div><h1>${esc(head)}</h1>
  ${scored&&ok?`<div class="gain">+${gained}</div>`:''}${scored&&S.streak>1?`<div style="font-weight:800">${esc(t('streakN',{n:S.streak}))}</div>`:''}
  ${ok===false&&ct?`<div class="corr">${esc(t('correctAnswer'))}: <b>${esc(ct)}</b></div>`:''}${extra}
  <button class="btn big" id="s-next">${esc(t('next'))} ▶</button></div></div>`);
 $('#s-x').onclick=soloExit;$('#s-next').onclick=soloNext;}

/* ================= start ================= */
document.documentElement.lang=LANG;
if(PARAMS.has('pin'))renderJoin(PARAMS.get('pin').replace(/\D/g,'').slice(0,6));else renderHome();
</script>
